[package]
name = "token22-stablecoin"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
bincode = "1.3.3"
bytemuck = "1.23"
litesvm = "0.16.0"
solana-clock = "3.1.1"
solana-compute-budget-interface = "3.0.0"
solana-instruction = "3.4.0"
solana-keypair = "3.1.2"
solana-pubkey = "4.0.0"
solana-signer = "3.0.1"
solana-system-interface = { version = "3.2.0", features = ["bincode"] }
solana-transaction = { version = "4.1.5", features = ["serde"] }
solana-zk-sdk = "7.0.1"
solana-zk-sdk-pod = "0.1.2"
solana-zk-elgamal-proof-interface = "0.1.3"
spl-associated-token-account-interface = "2.0.0"
spl-record = { version = "0.4.0", features = ["no-entrypoint"] }
spl-token-2022-interface = "3.1.2"
spl-token-confidential-transfer-proof-extraction = "0.6.1"
spl-token-confidential-transfer-proof-generation = "0.6.1"
spl-token-metadata-interface = "1.0.1"
spl-type-length-value = "0.9.1"
